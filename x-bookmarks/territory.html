<style>

<script>
const DATA={"territory": {"title": "Territory Account Plan", "start": "2026-11-02", "thesis": "Each account in this territory has made a public commitment that is mostly an engineering problem: ERP consolidation, digital-platform growth, cost-out, or cyber resilience, with fewer people. Lead every play with the customer's own stated challenge (Command of the Message). Qualify hard against MEDDPICC. Only forecast what the customer has agreed to in a mutual action plan.", "principles": ["Tier the territory, then time-block it. Tier 1 accounts get most of the hours.", "Know the customer's pain at every level, from CEO down to engineer, before the first call. Use their numbers and their words.", "Find the champion first, then the economic buyer. A champion has power, influence and a personal stake, and will sell for you when you're not in the room.", "Every stage has a customer-verifiable exit. If it isn't in the mutual action plan, it doesn't count toward the forecast.", "Scope before you prove. No proof of value without a go/no-go from the economic buyer and a cost justification.", "Inspect, don't expect. Score MEDDPICC weekly and act on the gaps."], "tiers": [{"tier": 1, "label": "Tier 1: build a full plan", "rule": "A large public engineering program, a named sponsor, and a large cost-out target. Weekly multi-thread outreach; exec alignment within 60 days."}, {"tier": 2, "label": "Tier 2: run plays", "rule": "A clear public pain but no named program owner yet. Persona plays every two weeks; aim for a champion within 90 days."}, {"tier": 3, "label": "Tier 3: nurture", "rule": "Watch for triggers like leadership changes, earnings commentary or job postings. Monthly touch."}], "pg": [{"lever": "Trigger-based outbound", "how": "Watch earnings calls, 10-K/20-F filings, leadership moves and job postings for signals like 'S/4HANA', 'modernization', 'cyber' and 'GenAI'. Each trigger starts a 3-touch sequence within 48 hours.", "target": "2 new meetings per Tier 1 account per month"}, {"lever": "Persona sequences", "how": "Use 4 sequences: platform/DevOps lead (backlog), modernization program lead (dates), CISO org (vulnerability backlog), CIO/CFO (savings ledger). Each opens with a challenge the customer has stated publicly.", "target": "Reply rate above 8%"}, {"lever": "Executive letters", "how": "Cognition leadership writes to the CIO/CFO for each Tier 1 account, tied to the company's own target.", "target": "1 exec meeting per Tier 1 account per quarter"}, {"lever": "Partner co-sell", "how": "Use AWS and Azure account teams, the Marketplace private-offer path, and the SI already running the program.", "target": "1 partner-sourced intro per account"}, {"lever": "Events and community", "how": "Use Digitalization in Oil & Gas, ARC Forum, CERAWeek, AWS re:Invent energy and Houston DevOps meetups. Book meetings before the event.", "target": "3 booked meetings per event"}, {"lever": "Champion referrals", "how": "Every closed proof of value asks for 2 introductions to sister business units.", "target": "1 expansion thread per win"}], "cadence": [{"when": "Daily", "what": "PG block (90 minutes): triggers, sequences, LinkedIn research on one account"}, {"when": "Weekly", "what": "MEDDPICC scorecard update; MAP review with each active champion; forecast call with evidence only"}, {"when": "Monthly", "what": "Re-check stakeholders (leaders change often), refresh each account's public challenges, exec sponsor touch"}, {"when": "Quarterly", "what": "Territory review: re-tier accounts, add new oil & gas accounts, retire stale plays"}], "linkedin": ["LinkedIn is not scraped here. Names come from public sources: filings, press releases, conference agendas, and aggregators that copy LinkedIn. Each name links to its source.", "'Verify' means you confirm the name on LinkedIn or Sales Navigator before any outreach: current title, start date, reporting line.", "Each role has a search button. Save the results as a Sales Navigator lead list per account and record champion tests (power, influence, personal stake) in the CRM.", "Re-check every month. Several leaders in this territory change roles in Jan 2027."], "add_account": "To add an account, add data/accounts/<id>.json (research) and data/territory/<id>.json (plan), add the id to 'order' below, then run: python3 tools/build_territory.py", "order": ["exxonmobil", "chevron", "halliburton", "slb", "enterpriseproducts"]}, "accounts": [{"id": "exxonmobil", "account": "ExxonMobil", "research": "exxonmobil", "tier": 1, "stage": "Prospect: no relationship yet", "thesis": "ExxonMobil has told the market it will hit $20B of structural savings by 2030 and run a single SAP S/4HANA instance by 2028, while cutting about 2,000 roles and centralizing IT. The ~65M lines of ECC6 custom code are on the critical path to both commitments. Devin is the extra engineering capacity that turns the custom-code triage, remediation and testing from SI hours into a measured, parallel workload, and the savings show up on the ledger the CFO already reports.", "why_now": [{"t": "The 2028 S/4HANA target means custom-code decisions get made in the next 12-18 months, whether or not Devin is involved.", "ref": "tech_posture:0"}, {"t": "The new CFO, Neil Hansen, ran Global Business Solutions (GBS), the group that owns the ERP and process program. The economic sponsor already knows the pain first-hand.", "ref": "recent_events:3"}, {"t": "$16.3B of the $20B savings is banked. The last $3.7B is the hardest, and workforce cuts are a named lever, so capacity without headcount fits the plan.", "ref": "snapshot:8"}, {"t": "Centralization into Global Operations plus the Budapest, Bengaluru and Buenos Aires centers concentrates engineering decisions in fewer hands, so fewer people need to say yes.", "ref": "recent_events:1"}, {"t": "Four IT leaders are new in role (Brad Harris, Ryan Seager, James Lynch and others), and new leaders set new agendas.", "ref": ""}], "challenges": [{"stated": "Consolidate 12 ERP systems into one SAP S/4HANA instance by 2028. The CEO says it is 'already delivering results'.", "who": "Darren Woods, CEO", "ref": "tech_posture:0", "devin": "Devin and Code Scans inventory and classify custom objects and interfaces as retire, rewrite or keep, then parallel Devins remediate and test them."}, {"stated": "About 65M lines of custom ECC6 code, which the CFO called a record among SAP customers, plus a decades-old consolidation mainframe to retire.", "who": "CFO, via LeMondeInformatique", "ref": "tech_posture:1", "devin": "Legacy analysis and documentation at codebase scale, plus mainframe and interface rewrites with tests and recordings as proof of work."}, {"stated": "$20B structural cost savings vs 2019 by 2030, with operational efficiencies and workforce reductions named as drivers.", "who": "Corporate release, Dec 2025", "ref": "snapshot:5", "devin": "Count Devin output in SI and contractor hours avoided, so it maps straight onto the savings ledger."}, {"stated": "Cut ~2,000 jobs by end-2027 and centralize ops, projects, technology and supply chain.", "who": "OGJ, Sep and Nov 2025", "ref": "recent_events:0", "devin": "Keeps the backlog from growing as headcount falls, and captures legacy-system knowledge in DeepWiki and Knowledge before people leave."}, {"stated": "The board treats cyber as a priority: the VP of IT runs the cybersecurity program, and the Audit Committee reviews it every year.", "who": "10-K FY2025", "ref": "agent_signals:2", "devin": "Each Devin runs in its own isolated machine, and every change comes with recorded proof of work. That gives the cyber review an audit trail instead of a black box."}, {"stated": "'Technology-led business with structurally stronger earnings power.'", "who": "Darren Woods, CEO", "ref": "snapshot:7", "devin": "This is the CEO's own phrase. Use it to frame Devin as a technology lever on earnings, not an IT tool."}], "pain_chain": [{"level": "L1 CEO / CFO / Board", "pain": "$20B savings and the 2030 plan depend on finishing the ERP consolidation on time.", "measure": "Structural savings banked; ROCE > 17% by 2030"}, {"level": "L2 GBS President / VP IT", "pain": "The S/4HANA date is at risk from custom-code volume and SI capacity, and IT headcount is falling.", "measure": "Program milestones; SI run-rate; cyber findings open"}, {"level": "L3 IT Global Projects / Business Transformation directors", "pain": "Custom-code triage and interface rewrites are slower than planned, and testing is the bottleneck.", "measure": "Objects triaged per week; defects found in test; cutover readiness"}, {"level": "L4 SAP technical leads, GBC engineering managers", "pain": "Undocumented ABAP, a shrinking pool of people who know it, and manual regression testing.", "measure": "Hours per object; review backlog; on-call pages"}], "com": {"elevator": "You've committed $20B of structural savings and a single S/4HANA instance by 2028, with fewer people. Devin is an autonomous AI software engineer that works through the custom-code and interface backlog in parallel, in isolated machines, with proof of work on every change. That moves the date in and the SI spend down.", "before": ["65M lines of custom code triaged mostly by people, with SI teams billing by the hour", "Interface and mainframe rewrites queued behind a shrinking IT bench", "Coding assistants in the IDE, if any, that don't move whole migration tasks", "Cyber and OT security reviews slow down anything 'AI' that touches code"], "negative": ["S/4HANA dates slip, legacy ECC6 and the mainframe run in parallel for longer, and dual-running costs eat into savings", "SI change orders grow the run-and-maintain line", "Knowledge of legacy systems leaves with the people being cut", "Regulatory and cyber exposure from rushed, under-tested cutover code"], "after": ["Every custom object classified and documented, with a remediation plan per object", "Rewrite and test work running in parallel across Devins, with recordings for reviewers", "SI hours and dual-running months come off the savings ledger", "A governed, auditable AI engineering pattern IT can reuse across Upstream IT and the GBCs"], "required": ["Runs in isolated, customer-governed machines with no code leaving approved boundaries", "Works at codebase scale: thousands of objects in parallel, deterministic and resumable", "Proof of work: tests and recordings on every change, reviewed against their own standards", "Fits the identity, repo and ticketing stack (SailPoint, ServiceNow, Kubernetes; confirm the SAP transport and CI path)", "Spend tied to measured output, not seats"], "metrics": ["Custom objects triaged per week (baseline from the program office)", "Hours per object remediated and tested vs SI baseline", "Months of ECC6 and mainframe dual-running avoided", "Defects escaping to integration test", "Mean time to close critical vulnerabilities in scoped repos"], "how": ["Code Scans to inventory and classify the estate", "Dynamic Workflows to run parallel Devins over the object list", "DeepWiki and Knowledge to capture legacy logic", "Devin Review and recordings for proof of work", "Isolated VMs on Windows and Linux for the security review"], "proof": ["Use the customer stories from the playbook: swarms (parallel migration), harness, security", "Confirm ABAP and SAP-side support with the solutions engineer before you scope it"]}, "meddpicc": [{"l": "M", "score": 1, "known": "Public metrics: $20B savings, 2028 S/4 date, 65M lines.", "gap": "No internal baseline yet for hours per object, SI run-rate or objects remaining.", "next": "In the first discovery call, ask the program office for objects triaged to date and the SI rate card."}, {"l": "E", "score": 1, "known": "VP IT Michael Deal; new CIO Global Ops Brad Harris (Aug 2026); segment CIOs Khan and Comstock; VP Business Transformation Keillor; CFO Hansen as sponsor.", "gap": "Which of them signs for S/4 program capacity. GBS successor still unknown.", "next": "Ask the champion: 'Who signs for capacity on the S/4 program, Deal or Keillor?'"}, {"l": "D1", "name": "Decision criteria", "score": 0, "known": "Todd Benner sets rent/buy/build criteria for applications. Security criteria come from the CISO (Bryan P.) and the OT CISO (Shafi).", "gap": "No written criteria yet.", "next": "Co-write the criteria with Benner and the champion; seed isolated machines and proof of work."}, {"l": "D2", "name": "Decision process", "score": 0, "known": "AI governance and cyber review are almost certainly required, and OT has its own review.", "gap": "Steps, owners and dates unknown.", "next": "Map the steps: tech eval, then cyber/AI governance, then architecture, then EB, then procurement."}, {"l": "P", "score": 0, "known": "Large-enterprise supplier onboarding; SAP and SI contracts in place.", "gap": "Paper process, vendor-onboarding lead time, MSA path (direct or via AWS Marketplace).", "next": "Ask about AWS Marketplace and private offers early. ExxonMobil is a large AWS customer."}, {"l": "I", "score": 1, "known": "Pain is implied by public commitments.", "gap": "Nobody has named a slipping milestone yet, or said who it hurts.", "next": "Scoping: 'Which S/4 wave is most at risk, and who owns that date?'"}, {"l": "C1", "name": "Champion", "score": 0, "known": "Shortlist from Sales Navigator: Aaron Surber (R2R IT, ERP consolidation), Neil Higgins (SAP Group Reporting), Ryan Seager (Global Ops IT projects). Paolo Biagi is a portfolio coach.", "gap": "Nobody tested yet for power plus vested interest.", "next": "Open with Surber; ask Biagi who owns custom-code remediation."}, {"l": "C2", "name": "Competition", "score": 1, "known": "SAP tooling and SIs; a copilot and LLM foundation and a Gen AI org exist (Sales Nav). AWS confirmed; no Azure or GCP seen at leadership level.", "gap": "Whether coding is in scope for the existing AI program, and who the S/4 SI is.", "next": "Ask Mathews or Biagi whether coding agents are in scope. Lead with AWS, not a multi-cloud message."}], "stakeholders": [{"name": "Neil A. Hansen", "title": "SVP & CFO (ex-President, GBS)", "role": "Economic sponsor", "letter": "E", "src": "leaders:1", "verify": false, "cares": "Savings ledger; he owned the ERP program until Jan 2026", "approach": "Don't open cold. Reach him through the GBS President or VP IT once you have a cost justification. Use a one-page savings narrative."}, {"name": "Michael Deal", "title": "Vice President of IT (since May 2023)", "role": "Economic buyer (likely)", "letter": "E", "src": "", "verify": false, "cares": "IT run cost; the 10-K places the cyber program under the VP of IT", "approach": "Exec-to-exec letter from Cognition leadership tied to the $20B savings target. Ask for 30 minutes on governed AI engineering capacity.", "src_url": "exxonmobil.html#people"}, {"name": "Brad Harris", "title": "CIO, Global Operations (new, Aug 2026)", "role": "Economic buyer / sponsor (Global Ops)", "letter": "E", "src": "", "verify": false, "cares": "Ex-Head of Upstream IT: global agile delivery, capability centers", "approach": "New in role, so he's setting his agenda now. Pitch capacity for the consolidated Global Operations portfolio within his first 6 months.", "src_url": "exxonmobil.html#people"}, {"name": "Bill Keillor", "title": "VP, Business Transformation (since May 2023)", "role": "Economic buyer / sponsor (ERP)", "letter": "E", "src": "", "verify": false, "cares": "Transformation program delivery", "approach": "Lead with S/4 custom-code triage: 'what would it take to classify all custom objects in 30 days?'", "src_url": "exxonmobil.html#people"}, {"name": "Carla Khan", "title": "CIO, Commercial, Supply Chain & Trading (since Jul 2025)", "role": "Economic buyer (segment)", "letter": "E", "src": "", "verify": false, "cares": "Commercial and trading applications", "approach": "Second EB thread for the supply chain and trading app backlog.", "src_url": "exxonmobil.html#people"}, {"name": "Steve Comstock", "title": "CIO, Upstream", "role": "Economic buyer (segment)", "letter": "E", "src": "", "verify": false, "cares": "Upstream applications, Permian/Guyana growth", "approach": "Upstream thread, alongside Azmil Ab Aziz.", "src_url": "exxonmobil.html#people"}, {"name": "Aaron Surber", "title": "Head of Record to Report IT (since Apr 2022)", "role": "Champion candidate (ERP)", "letter": "C1", "src": "", "verify": false, "cares": "Consolidating legacy systems into a modern ERP; 250+ staff in 17 teams", "approach": "Top champion target for the S/4 custom-code play. He owns a slice of the ERP work directly.", "src_url": "exxonmobil.html#people"}, {"name": "Neil Higgins", "title": "Director, Business Transformation: SAP Group Reporting", "role": "Champion candidate (ERP)", "letter": "C1", "src": "", "verify": false, "cares": "SAP Group Reporting", "approach": "Profile not opened yet. Check scope, then pitch custom-code triage for his workstream.", "src_url": "exxonmobil.html#people"}, {"name": "Paolo Biagi", "title": "Senior IT Director, IT Global Projects (since Apr 2023)", "role": "Coach / champion candidate", "letter": "C1", "src": "", "verify": false, "cares": "$150-200M portfolio, ~35 projects a year; AWS migration of 3,000+ apps; GenAI foundation", "approach": "Portfolio-level contact, not the ERP owner. Ask him who owns custom-code remediation.", "src_url": "exxonmobil.html#people"}, {"name": "Ryan Seager", "title": "Senior IT Director, Global Operations IT Projects (new, Aug 2026)", "role": "Champion candidate (Global Ops)", "letter": "C1", "src": "", "verify": false, "cares": "Supply-chain modernization; SaaS and Snowflake", "approach": "New in role. Pitch a delivery-capacity POV for Global Ops projects.", "src_url": "exxonmobil.html#people"}, {"name": "Todd Benner", "title": "Chief Enterprise Architect & IT Fellow; Chief Applications Architect", "role": "Technical buyer (decision criteria)", "letter": "D1", "src": "", "verify": false, "cares": "Sets the rent / buy / build approach for applications; 36 years at ExxonMobil", "approach": "Gatekeeper for the modernization approach. Co-write the evaluation criteria with him and lead with architecture fit.", "src_url": "exxonmobil.html#people"}, {"name": "Bryan P.", "title": "CISO and IT Risk Management Director (since Jan 2025)", "role": "Technical buyer / potential blocker", "letter": "D2", "src": "", "verify": false, "cares": "IT risk; ex-Hosting & Platforms Manager", "approach": "Bring him the security pack (isolated machines, audit trail) by week 4.", "src_url": "exxonmobil.html#people"}, {"name": "Shazad Shafi", "title": "OT Chief Information Security Officer (since Dec 2023)", "role": "Technical buyer (OT)", "letter": "D2", "src": "", "verify": false, "cares": "OT resilience, critical infrastructure", "approach": "Devin never touches OT. Get him to sign that boundary off early, then use it for the OT expansion later.", "src_url": "exxonmobil.html#people"}, {"name": "Matthew Knies", "title": "Senior Director, Identity & Access Management", "role": "Technical buyer (access)", "letter": "D1", "src": "", "verify": false, "cares": "IAM modernization; 300+ staff in Bangalore", "approach": "Agree the SailPoint/IAM pattern for Devin's machine identities.", "src_url": "exxonmobil.html#people"}, {"name": "Darien Mathews", "title": "Head of IT, AI Business & Strategy", "role": "Influencer (AI program)", "letter": "I", "src": "", "verify": false, "cares": "Enterprise AI strategy", "approach": "A copilot and LLM foundation already exists. Ask whether coding agents are in scope and who owns them.", "src_url": "exxonmobil.html#people"}, {"name": "Azmil Ab Aziz", "title": "General Manager, Upstream IT (Kuala Lumpur)", "role": "Champion candidate (Upstream)", "letter": "C1", "src": "", "verify": false, "cares": "Production technologies; IT workforce and location strategy", "approach": "Upstream modernization backlog thread.", "src_url": "exxonmobil.html#people"}, {"name": "Whit McConnell", "title": "Chief Automation & Process Control E l-20251231.htm", "date": "2026-02"}, {"fact": "Over 46,000 employees as of Dec 31, 2025, across 146 nationalities and more than 70 countries (down from nearly 48,000 at end of 2024 per Zacks).", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02"}, {"fact": "Q2 2026 revenue $5.7B (C&P $3.2B, D&E $2.5B); North America $2.3B, International $3.4B; net income $534M; free cash flow $668M; ~$200M buybacks.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-announces-second-quarter-2026-results", "date": "2026-07"}, {"fact": "Stated 2026 focus areas: international growth (directional drilling, unconventionals, well intervention, artificial lift, VoltaGrid power), North America 'Maximize Value' (Zeus IQ e-frac, iCruise, LOGIX automation), deploying digital and automation internally and for customers, ~$1.1B capex, >50% of FCF returned to shareholders, low-carbon growth.", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02"}, {"fact": "Landmark Software and Services provides cloud-based digital services and AI solutions for subsurface insights, well construction, and reservoir and production management.", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02"}, {"fact": "Major 2026 wins include Aramco lump-sum turnkey contracts for ~285 onshore wells, a multi-year Aramco unconventional gas stimulation contract, TotalEnergies GranMorgu (Suriname) deepwater integrated drilling/completions, and Basra Oil Company integrated field management (Landmark software supports the Basra contract).", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-announces-second-quarter-2026-results", "date": "2026-07"}, {"fact": "CEO Jeff Miller: 'differentiated technology and value proposition set the stage for revenue growth and margin expansion', with a 'consistent focus on returns and capital discipline'.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-announces-second-quarter-2026-results", "date": "2026-07"}], "tech_posture": [{"fact": "Landmark product portfolio showcased at LIFE2025: DecisionSpace 365 suite, Unified Ensemble Modeling (UEM), Agile Asset Management (AAM); plus LOGIX automation/remote ops and ZEUS IQ intelligent fracturing. Miller: 'Digital technologies and automation are central to how we manage and execute our business.'", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-delivers-on-digital-vision-at-landmark-innovation-forum-and-expo", "date": "2025-07"}, {"fact": "Acquired InformatiQ AS (Norway), a cloud-native SaaS company (geologiQ 3D field/well digital twin, well planning, regulatory docs, AI-enabled offset well analysis, SAP-integrated logistics via traQ/LogistiQ); framed as reinforcing Landmark's cloud-native delivery and AI-supported insight.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-acquires-informatiq-to-expand-cloud-native-digital-capabilities", "date": "2026-06"}, {"fact": "Strategic collaboration with Shape Digital (MODEC spin-off) linking Landmark's Digital Field Solver with Shape Lighthouse/Aura/Reef for AI-driven digital asset performance management.", "src": "https://worldoil.com/news/2026/5/6/halliburton-shape-digital-target-production-optimization-with-ai-asset-management/", "date": "2026-05"}, {"fact": "2026 Technology Showcase (Houston, May 4-7) presented integration of software, AI and automation into real-time operations: live automated frac site, ZEUS IQ, LOGIX closed-loop rig control for drilling and geosteering, OCTIV Auto Frac, automated cementing.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-delivers-end-to-end-digital-execution-at-2026-technology-showcase", "date": "2026-06"}, {"fact": "Landmark is hiring 'AI Agent Architect - Industrial AI Systems' (Bengaluru req 210286; also Brazil remote) to build a multi-agent framework with LangChain/AutoGen/CrewAI or custom stacks, LLMs, RAG, Python, on Azure or AWS, integrating engineering tools, simulators and databases.", "src": "https://jobs.weekday.works/wkdyaex2nj", "date": "2026"}, {"fact": "Landmark iEnergy Stack: private/hybrid E&P cloud running DecisionSpace 365 on-premises, including a 'restricted management' mode with no outbound connectivity; positioned for data sovereignty/residency; OSDU-compliant apps.", "src": "https://www.halliburton.com/en/resources/leverage-cloud-benefits-on-premise-using-ienergy-stack", "date": "2022-01"}, {"fact": "Five-year strategic agreement (2020) with Microsoft and Accenture/Avanade to move Halliburton to Azure, migrate all physical data centers to Azure (staged by 2022), and build out the Halliburton Data Lake with ML/AI. Five-year term would have run to ~2025; current status not found.", "src": "https://news.microsoft.com/2020/07/17/halliburton-forms-strategic-agreement-with-microsoft-and-accenture-to-advance-digital-capabilities/", "date": "2020-07"}, {"fact": "Internal ERP modernization under way: SAP S/4 migration costs were $50M in Q3 2025 and expected ~$40M in Q4 2025.", "src": "https://www.fool.com/earnings/call-transcripts/2025/10/21/halliburton-hal-q3-2025-earnings-call-transcript/", "date": "2025-10"}, {"fact": "CIO leads all IT functions (20+ years at Halliburton); CISO (25+ years experience) reports to the EVP & Chief Administrative Officer and briefs the Board quarterly.", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02"}], "leaders": [{"name": "Jeffrey A. Miller", "title": "Chairman, President and CEO", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02", "stale": false}, {"name": "J. Shannon Slocum", "title": "EVP and Chief Operating Officer (from Jan 1, 2026; owns global operations, business development, HSE and worldwide 01226000015/hal-20251231.htm", "date": "2026-02", "stale": false}], "recent_events": [{"fact": "Reuters-reported layoffs began ~Sept 2025; insiders said roughly 20%-40% of employees in multiple divisions were cut (company did not disclose full scope).", "src": "https://www.zacks.com/stock/news/2748080/halliburton-cuts-jobs-as-oil-prices-&-demand-pressure-industry", "date": "2025-09"}, {"fact": "Q3 2025: $284M of severance and fixed/other asset write-offs; Miller said 'rightsizing our operations and overhead' would cut quarterly labor costs by ~$100M starting Q4 2025; 2026 capex to fall almost 30% to ~$1B.", "src": "https://www.fool.com/earnings/call-transcripts/2025/10/21/halliburton-hal-q3-2025-earnings-call-transcript/", "date": "2025-10"}, {"fact": "Leadership reshuffle: Shannon Slocum promoted to EVP & COO (effective Jan 1, 2026, joining the board) with worldwide technology in scope; Rami Yassine named head of Eastern Hemisphere.", "src": "https://www.oilandgas360.com/halliburton-names-new-evp-coo-advancing-global-operations-strategy/", "date": "2025-12"}, {"fact": "Acquired InformatiQ AS to expand Landmark's cloud-native digital capabilities.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-acquires-informatiq-to-expand-cloud-native-digital-capabilities", "date": "2026-06"}, {"fact": "Shape Digital strategic collaboration announced for AI asset performance management.", "src": "https://worldoil.com/news/2026/5/6/halliburton-shape-digital-target-production-optimization-with-ai-asset-management/", "date": "2026-05"}, {"fact": "VoltaGrid collaboration: 400 MW of modular natural-gas power for data centers, starting in the Middle East, slated for 2028 delivery.", "src": "https://halliburton.com/en/about-us/press-release/halliburton-announces-fourth-quarter-2025-results", "date": "2026-01"}, {"fact": "Q2 2026 rebound: revenue $5.7B (up from $5.4B Q1); Miller expects demand growth in every region.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-announces-second-quarter-2026-results", "date": "2026-07"}, {"fact": "Chief Accounting Officer change: Stephanie Holzhauser replaced Charles Geer Jr. (effective July 16, 2025).", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501225000050/exhibit991-2025leadershi.htm", "date": "2025-07"}], "agent_signals": [{"fact": "August 2024 cyber incident: unauthorized access and exfiltration from corporate systems, systems shut down for containment, ~$35M cost; reports attributed it to RansomHub (not confirmed by Halliburton). Older than 12 months but still referenced as material in the FY2025 10-K.", "src": "https://www.securityweek.com/cyberattack-cost-oil-giant-halliburton-35-million/", "date": "2024-11"}, {"fact": "FY2025 10-K risk factors cite AI/ML as competitive technology trends and note AI-driven cyberattacks heighten risk.", "src": "https://www.sec.gov/Archives/edgar/data/45012/000004501226000015/hal-20251231.htm", "date": "2026-02"}, {"fact": "Landmark is building multi-agent LLM systems in-house (AI Agent Architect roles in Bengaluru and Brazil, Python, LangChain/AutoGen/CrewAI, Azure/AWS), which shows engineering teams active in agentic AI and a likely build-your-own preference.", "src": "https://remotejobs.org/remote-jobs/brazil-remote-ai-agent-architect-industrial-ai-systems-rio-de-janeiro-rj-halliburton", "date": "2026"}, {"fact": "Legacy/ERP modernization: SAP S/4 migration consumed $50M in Q3 2025 alone.", "src": "https://www.fool.com/earnings/call-transcripts/2025/10/21/halliburton-hal-q3-2025-earnings-call-transcript/", "date": "2025-10"}, {"fact": "Acquisition integration workload: InformatiQ cloud-native SaaS apps (geologiQ already connects to Landmark AAM) must be integrated into Landmark's portfolio.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-acquires-informatiq-to-expand-cloud-native-digital-capabilities", "date": "2026-06"}, {"fact": "Sovereignty/air-gapped requirement: Landmark iEnergy Stack offers on-prem deployment with no outbound connectivity and manual patch ingestion for NOC/high-security customers.", "src": "https://www.halliburton.com/en/resources/leverage-cloud-benefits-on-premise-using-ienergy-stack", "date": "2022-01"}, {"fact": "Microsoft-centric estate: 2020 agreement migrated all physical data centers to Azure with Accenture/Avanade as SI (stale; current status unverified).", "src": "https://news.microsoft.com/2020/07/17/halliburton-forms-strategic-agreement-with-microsoft-and-accenture-to-advance-digital-capabilities/", "date": "2020-07"}, {"fact": "OT/IT convergence: LOGIX closed-loop rig control, ZEUS IQ automated frac and automated cementing link software/AI directly to field equipment in real time.", "src": "https://www.halliburton.com/en/about-us/press-release/halliburton-delivers-end-to-end-digital-execution-at-2026-technology-showcase", "date": "2026-06"}, {"fact": "Cost pressure on labor: ~$100M/quarter labor cost reduction from the rightsizing, increasing pressure to do more engineering work with fewer people.", "src": "https://www.fool.com/earnings/call-transcripts/2025/10/21/halliburton-hal-q3-2025-earnings-call-transcript/", "date": "2025-10"}], "hypotheses": {"pains": ["HYPOTHESIS: After 2025 cuts, Landmark and the IT org must still ship a large, aging software portfolio (DecisionSpace 365, AAM, UEM, DFS, iEnergy) with fewer engineers, so backlog, test coverage and release cadence suffer.", "HYPOTHESIS: Integrating acquired code (InformatiQ SaaS) and older on-prem/desktop Landmark apps into one cloud-native platform is a large, repetitive modernization job that suits Devin.", "HYPOTHESIS: iEnergy restricted-mode and NOC customers (Aramco, Basra, etc.) require air-gapped/sovereign builds; supporting several deployment variants and patch pipelines is costly. Devin's own cloud machines or VPC deployment and security-scan capabilities may help.", "HYPOTHESIS: After the 2024 breach, security leadership wants codebase-wide vulnerability scanning and faster remediation across corporate and product code.", "HYPOTHESIS: The SAP S/4 migration leaves custom ABAP/integration code, interfaces and data-migration scripts to rewrite and test.", "HYPOTHESIS: Field automation software (LOGIX, ZEUS IQ, OCTIV) needs rigorous testing and on-call support in Windows-heavy OT and edge environments."], "economic_buyer": ["HYPOTHESIS: Tony Antoun, SVP Landmark Software & Services, for product engineering spend.", "HYPOTHESIS: CIO (unnamed in 10-K, likely reporting into the CAO organization) for internal IT/application modernization and the SAP program.", "HYPOTHESIS: Shannon Slocum, EVP & COO, who now owns worldwide technology, for an enterprise-wide or field-automation software mandate.", "HYPOTHESIS: Lawrence Pope, EVP & CAO, as the executive over IT and security."], "champions": ["HYPOTHESIS: Landmark VP/Director of Engineering or Product Development (DecisionSpace 365 / AAM).", "HYPOTHESIS: Leads of Landmark's AI/agent engineering group (hiring AI Agent Architects in Bengaluru and Brazil).", "HYPOTHESIS: CISO or application security lead for vulnerability remediation use cases.", "HYPOTHESIS: Director of Enterprise Applications / SAP S/4 program lead.", "HYPOTHESIS: Software leads for the LOGIX / ZEUS IQ automation platforms in the Drilling & Evaluation and Completion & Production organizations."], "competition": ["HYPOTHESIS: GitHub Copilot through the Microsoft/Azure relationship (Microsoft has been a strategic partner since 2020).", "HYPOTHESIS: Internal builds, since Landmark already builds multi-agent frameworks with LangChain/AutoGen/CrewAI.", "HYPOTHESIS: SIs such as Accenture/Avanade (the 2020 Azure migration partner) and likely offshore delivery centers in India, which may bundle AI-assisted delivery.", "HYPOTHESIS: Other coding agents and IDEs (Cursor, Claude Code, Amazon Q Developer/Kiro, Google tooling) adopted bottom-up by engineers.", "HYPOTHESIS: Competing for budget against SLB/Cognite-style digital platforms and Landmark's own product roadmap investment."], "openers": ["After the 2025 rightsizing, how has Landmark's engineering capacity changed against the roadmap? Which work (InformatiQ integration, DecisionSpace 365 modernization, iEnergy variants) is now waiting for capacity?", "Your Landmark team is building multi-agent systems for customers. What are you using internally to speed up your own software engineering, and where have Copilot-style assistants stopped short of autonomous work such as migrations, test generation or vulnerability fixes?", "For NOC and sovereign customers running iEnergy in restricted mode, what does it take today to build, patch and validate a release? Would an agent that runs inside your own environment change how you staff that work?"]}, "notes": "CIO and CISO are described but not named in the FY2025 10-K; no public CTO, CDO or head-of-AI title was found, and the COO now owns 'worldwide technology'. Use LinkedIn or Sales Navigator to confirm names. Layoff scale (20-40% in some divisions) comes from unnamed insiders via Reuters/Zacks and is not company-confirmed; the 10-K headcount went from ~48k to >46k. The Microsoft/Accenture Azure agreement (2020, 5-year term) is stale and its renewal status is unknown. The iEnergy Stack page dates from 2022. The AI Agent Architect job postings have no exact posting date (captured 2026). Full-year 2025 segment revenue in dollars was not extracted; only Q4 2025 and Q2 2026 segment figures were. The Q3 2026 earnings release (expected late Oct 2026) was not yet available. The AIQ (Abu Dhabi)-Landmark partner agreement dates from July 2024, and its terms were not found."}}, {"id": "slb", "account": "SLB", "research": "slb", "tier": 1, "stage": "Prospect: no relationship yet", "play": "Integration and modernization behind the 2030 digital margin target", "thesis": "SLB told investors it is 'becoming a digital-first company'. It plans to double Digital to ~$2B ARR and lift EBITDA margin from ~26% to 38-42% by 2030, while integrating ChampionX, Tachyus and the S&P Global upstream software portfolio and certifying ~200 marketplace products. That margin gap is mostly about engineering productivity. Devin closes it with parallel integration, modernization and certification work, as capacity for the teams building Lumi and Tela.", "why_now": [{"t": "The 2030 Digital targets are public, and the margin has to rise by 12-16 points.", "ref": "snapshot:6"}, {"t": "Q1 2026 Digital EBITDA margin fell to 26.1%.", "ref": "agent_signals:5"}, {"t": "Three acquired software stacks are being integrated now.", "ref": "agent_signals:0"}, {"t": "Q3 2026 results on Oct 23. Use the call commentary as a fresh trigger.", "ref": "snapshot:8"}], "challenges": [{"stated": "Double Digital revenue and ARR to ~$2B, with a 38-42% EBITDA margin by 2030.", "who": "Digital Investor Day, Jun 2026", "ref": "snapshot:6", "devin": "Ship more product without growing R&D at the same rate. Devin output is measured against margin."}, {"stated": "'Becoming a digital-first company'.", "who": "Olivier Le Peuch, CEO", "ref": "snapshot:5", "devin": "Use the CEO's phrase as the opener for the value story."}, {"stated": "Integrating ChampionX, Tachyus and the S&P Global upstream software into Delfi and Lumi.", "who": "Q2 2026 / Apr 2026 releases", "ref": "agent_signals:0", "devin": "Parallel Devins for adapters, migrations and regression tests."}, {"stated": "Marketplace certification for security, interoperability and compatibility on ~200 products from 30+ partners.", "who": "SLB marketplace launch", "ref": "agent_signals:3", "devin": "Code Scans and Security Swarm as a certification pipeline. Devin could also be a marketplace listing itself."}, {"stated": "Products must support multi-cloud, on-prem and edge deployment.", "who": "Investor Day", "ref": "agent_signals:2", "devin": "Build, test and upgrade work across every deployment target, run in parallel."}, {"stated": "More than 120 Petrel plug-ins built on Ocean, a Microsoft-based framework.", "who": "SLB developer docs", "ref": "agent_signals:1", "devin": "Windows machines for desktop-product testing and .NET modernization."}], "pain_chain": [{"level": "L1 CEO / CFO", "pain": "The digital-first story and the 2030 margin commitment to investors.", "measure": "Digital ARR; EBITDA margin 38-42%"}, {"level": "L2 President Digital / CTO / CPO", "pain": "Integration and modernization use up R&D capacity after $407M of workforce charges.", "measure": "Roadmap delivery; R&D as a share of revenue"}, {"level": "L3 Delfi/Lumi platform and product engineering heads", "pain": "Three codebases, multi-cloud targets, and a plug-in compatibility burden.", "measure": "Integration milestones; release cadence"}, {"level": "L4 Engineers", "pain": ".NET desktop debt, CVE toil, certification testing.", "measure": "Backlog; time-to-certify"}], "com": {"elevator": "You've committed to doubling Digital and adding 12-16 margin points by 2030 while integrating three acquired software stacks. Devin gives your platform teams autonomous engineers for integration, modernization and certification work, so you ship more without hiring at the same rate.", "before": ["Senior engineers tied up integrating acquisitions", "Petrel and Ocean .NET modernization is slow and risky for plug-in compatibility", "Certification and multi-cloud testing are bottlenecks"], "negative": ["Margin target missed; ARR growth limited by capacity", "Customers held back by compatibility breaks", "Partners are slower to list on the marketplace"], "after": ["Integration work done in parallel with tests", "Modernization done incrementally with compatibility suites", "Certification pipeline run by Devin"], "required": ["Windows and Linux machines", "Fits multi-cloud CI", "Protects IP and runs in isolated machines", "Works alongside SLB's own agent frameworks"], "metrics": ["Integration milestones vs plan", "Engineering cost per release", "Time-to-certify a marketplace listing", "Digital EBITDA margin contribution"], "how": ["Dynamic Workflows", "Code Scans and Security Swarm", "Windows VMs", "DeepWiki"], "proof": ["Customer stories: swarms, harness, security", "Possible partnership: listing on the SLB marketplace"]}, "meddpicc": [{"l": "M", "score": 1, "known": "2030 ARR and margin targets; Q1 margin 26.1%.", "gap": "No R&D productivity baseline.", "next": "Ask about engineering cost per release and the size of the integration backlog."}, {"l": "E", "score": 1, "known": "Rakesh Jaggi (Digital), Demos Pafitis (CTO), Tarek Rizk (CPO, IT).", "gap": "Which budget pays: product R&D or internal IT.", "next": "The champion confirms who owns engineering tooling spend."}, {"l": "D1", "score": 0, "known": "-", "gap": "Criteria unknown; probably IP protection and build-vs-buy.", "next": "Seed isolation and Windows support as criteria."}, {"l": "D2", "score": 0, "known": "-", "gap": "Process unknown.", "next": "Map it with the champion."}, {"l": "P", "score": 0, "known": "Partners with Microsoft, AWS, Google.", "gap": "Path: vendor, partner or marketplace.", "next": "Explore a dual track: customer and marketplace partner."}, {"l": "I", "score": 1, "known": "The margin pain is public.", "gap": "No named owner of the gap.", "next": "Discovery with a platform engineering head."}, {"l": "C1", "score": 0, "known": "-", "gap": "No champion.", "next": "Target Delfi/Lumi platform engineering VPs."}, {"l": "C2", "score": 1, "known": "Own agent builds (Tela, Lumi agentic framework, NVIDIA).", "gap": "Which coding tools are used internally.", "next": "Frame Devin as capacity for the people building Lumi."}], "stakeholders": [{"name": "Rakesh Jaggi", "title": "President, Digital", "role": "Economic buyer (likely)", "letter": "E", "src": "leaders:1", "verify": false, "cares": "2030 Digital ARR and margin", "approach": "Exec letter tied to the margin gap."}, {"name": "Demosthenis Pafitis", "title": "Chief Technology Officer", "role": "Economic buyer / technical", "letter": "E", "src": "leaders:2", "verify": false, "cares": "Technology centers' productivity", "approach": "Pitch R&D velocity."}, {"name": "Tarek Rizk", "title": "Chief Performance Officer (incl. IT)", "role": "Economic buyer (internal IT)", "letter": "E", "src": "leaders:3", "verify": false, "cares": "Cost agenda; IT and digital enablement", "approach": "Second thread: internal IT and ChampionX system consolidation."}, {"name": "Stephane Biguet", "title": "EVP & CFO", "role": "Influencer", "letter": "I", "src": "leaders:4", "verify": false, "cares": "Digital margin path", "approach": "Use the savings narrative later."}, {"name": "TBD", "title": "CIO (Cybersecurity Director reports in)", "role": "Technical buyer", "letter": "D1", "src": "leaders:6", "verify": true, "cares": "Internal IT and security", "approach": "Find the name first.", "q": "SLB \"chief information officer\""}, {"name": "TBD", "title": "VP / Head of Delfi or Lumi platform engineering", "role": "Champion candidate", "letter": "C1", "src": "", "verify": true, "cares": "Integration and release cadence", "approach": "Primary champion target.", "q": "SLB (Delfi OR Lumi) \"platform engineering\" OR \"engineering director\""}, {"name": "TBD", "title": "Petrel / Ocean engineering manager", "role": "Technical buyer", "letter": "D1", "src": "", "verify": true, "cares": ".NET modernization; plug-in compatibility", "approach": "Pitch Windows VM testing.", "q": "SLB Petrel OR Ocean \"engineering manager\""}, {"name": "TBD", "title": "Marketplace partner program lead", "role": "Partner path", "letter": "P", "src": "", "verify": true, "cares": "Listings and certification", "approach": "Explore Devin as a listing and as a certification tool.", "q": "SLB digital marketplace partner"}], "searches": [{"label": "Digital engineering leaders", "q": "SLB Digital (\"VP\" OR director) engineering"}, {"label": "ChampionX digital integration", "q": "SLB ChampionX digital integration manager"}, {"label": "Tela / Lumi AI engineering", "q": "SLB (Tela OR Lumi) AI engineering"}], "engagement": {"entry": "Champion in Delfi/Lumi platform engineering; EB is Rakesh Jaggi, approached with a margin narrative. Run a parallel partner conversation with the marketplace team.", "phases": [{"when": "Weeks 1-2", "what": ["Use the Q3 call (Oct 23) as a trigger", "Build the Digital engineering list"]}, {"when": "Weeks 2-6", "what": ["Outreach sequence; discovery on integration backlog", "Open the marketplace partner conversation"]}, {"when": "Weeks 6-14", "what": ["Scope a POV: acquired-code integration or Petrel plug-in compatibility suite"]}], "pg": [{"to": "Platform engineering heads", "channel": "LinkedIn + email", "message": "Three acquisitions to integrate and a 38-42% margin target. Parallel Devins take the integration and test work."}, {"to": "Rakesh Jaggi", "channel": "Exec letter", "message": "Digital-first means engineering leverage. Here's a measured path to the margin gap."}, {"to": "Marketplace team", "channel": "Partner intro", "message": "Devin as a certification pipeline and a marketplace listing."}], "events": ["SLB Digital Forum", "ADIPEC", "CERAWeek"], "partners": ["AWS, Microsoft, Google (SLB's hyperscaler partners)", "SLB digital marketplace"]}, "map": [{"wk": 0, "step": "Discovery with a platform engineering head", "owner": "Joint", "letter": "I", "exit": "Backlog named"}, {"wk": 2, "step": "Baseline integration backlog and cost per release", "owner": "SLB", "letter": "M", "exit": "Numbers"}, {"wk": 4, "step": "EB meeting (Jaggi org)", "owner": "Joint", "letter": "E", "exit": "Sponsor"}, {"wk": 5, "step": "IP and security review", "owner": "SLB", "letter": "D2", "exit": "Approved"}, {"wk": 6, "step": "POV plan signed", "owner": "Joint", "letter": "D1", "exit": "Criteria"}, {"wk": 7, "step": "POV", "owner": "Cognition", "letter": "M", "exit": "Results"}, {"wk": 13, "step": "Readout, proposal and paper", "owner": "Joint", "letter": "P", "exit": "Signed"}], "risks": [{"r": "Build-it-ourselves reflex (Tela, Lumi agents)", "m": "Frame Devin as capacity for SLB's builders; explore the partner track."}, {"r": "IP sensitivity of the Petrel codebase", "m": "Isolated machines; start with less sensitive repos."}], "next": ["Listen to the Q3 call on Oct 23", "Find the CIO and platform engineering heads", "Draft the exec letter to Jaggi"], "research_data": {"account": "SLB (formerly Schlumberger), including SLB Digital (Delfi, Lumi, Tela, Petrel/Techlog, Ocean)", "snapshot": [{"fact": "FY2025 revenue was $35.7B, down 2% YoY (down 6% excluding ChampionX's ~$1.5B contribution). SLB operates in more than 100 countries with about 109,000 employees.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}, {"fact": "Four divisions: Digital ($2.66B in FY2025), Reservoir Performance ($6.82B), Well Construction ($11.86B) and Production Systems ($13.33B). 'All Other' ($1.99B) covers Asset Performance Solutions, Data Center Solutions and SLB Capturi. Operations are organized into 5 Basins and GeoUnits.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}, {"fact": "Digital revenue grew 9% in 2025, driven by Digital Operations and Platforms & Applications.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}, {"fact": "Q2 2026 revenue was $8.97B (+5% YoY; -5% YoY excluding ChampionX). Digital was $697M (+18% YoY) with a 28% pretax margin. Digital ARR was $1.04B (+15% YoY). Production Systems was $3.77B (+29% YoY).", "src": "https://www.sec.gov/Archives/edgar/data/0000087347/000119312526315068/d122193dex99.htm", "date": "2026-07"}, {"fact": "Data Center Solutions revenue was $186M in Q2 2026 (+80% YoY). SLB targets a run rate above $1B by YE2026 and above $2B exiting 2027. It also announced an alliance with Liberty Energy for data center power and modular infrastructure.", "src": "https://www.sec.gov/Archives/edgar/data/0000087347/000119312526315068/d122193dex99.htm", "date": "2026-07"}, {"fact": "At the June 2026 Digital Investor Day, CEO Olivier Le Peuch told investors that SLB is 'becoming a digital-first company'.", "src": "https://www.upstreamonline.com/finance/slb-lays-out-planned-shift-toward-primary-digital-strategy-to-investors/2-1-2005657", "date": "2026-06"}, {"fact": "2030 Digital targets: roughly double Digital revenue/ARR to about $2B, Digital adjusted EBITDA of $1.8-2B and a 38-42% EBITDA margin. Operational adoption targets: autonomous drilling from ~3% to 25%, connected ESPs from ~35% to 60%, formation-evaluation digital add-ons from ~14% to 60%.", "src": "https://www.stockopedia.com/share-prices/schlumberger-nv-EPA:SLB/news/slb-looks-to-double-digital-business-revenue-core-profit-by-2030-updated-019ed6cb-6de8-7bc2-ac46-d060e2413b3b/", "date": "2026-06"}, {"fact": "Digital TAM is estimated at $25B (2025), rising to $35B, with upside to $50B if AI adoption accelerates. Oil and gas digital spend is 4-5% of industry spend, which SLB calls underpenetrated.", "src": "https://quartr.com/events/slb-n-v-slb-investor-day-2026_3YCy3gxu", "date": "2026-06"}, {"fact": "Q3 2026 results will be released on October 23, 2026, at 7:00 a.m. ET, with the call at 9:30 a.m. ET.", "src": "https://www.slb.com/newsroom/press-release/2026/pr-2026-0928-q3-earnings-call-announcement", "date": "2026-09"}], "tech_posture": [{"fact": "Lumi is SLB's data and AI platform. Tela, an agentic AI assistant launched in November 2025, is powered by Lumi and uses LLMs plus domain foundation models. Lumi's agentic framework lets customers build their own Tela agents.", "src": "https://www.slb.com/news-and-insights/newsroom/press-release/2025/pr-2025-1103-slb-tela-ai", "date": "2025-11"}, {"fact": "SLB says it has more than 150 AI-enabled applications deployed across its technologies, covering drilling risk prediction, predictive maintenance and production optimization.", "src": "https://www.slb.com/newsroom/features/2026/2026-0225-thrive-feature", "date": "2026-02"}, {"fact": "Expanded NVIDIA partnership: an 'AI Factory for Energy' reference environment combining NVIDIA Nemotron open models and Omniverse with Delfi and Lumi across ML, generative AI and agentic AI. SLB is also the modular design partner for NVIDIA DSX AI factories.", "src": "https://www.slb.com/newsroom/press-release/2026/pr-2026-0325-slb-nvidia", "date": "2026-03"}, {"fact": "Launched the SLB digital marketplace with about 200 products from SLB and more than 30 partners, including Delfi/Lumi SaaS, plug-ins, data connectors, and Tela skills, agents and models. Third-party offerings must pass SLB security, interoperability and compatibility certification. Developer portal: developer.slb.com.", "src": "https://www.slb.com/newsroom/press-release/2026/slb-launches-digital-marketplace-to-scale-ai-and-digital-innovation-across-energy", "date": "2026-06"}, {"fact": "At the Investor Day, SLB described an open architecture supporting multi-cloud, on-prem and edge deployment, with hyperscaler partners Microsoft, AWS and Google, plus NVIDIA. It cited 2,600+ experts and more than $3B in R&D since 2016.", "src": "https://quartr.com/events/slb-n-v-slb-investor-day-2026_3YCy3gxu", "date": "2026-06"}, {"fact": "AWS expanded its SLB partnership to bring Petrel and Techlog to AWS and to make AWS Energy Data Insights compatible with Lumi (launched at Digital Forum 2024).", "src": "https://press.aboutamazon.com/2024/9/amazon-and-aws-expand-partnership-with-slb-to-accelerate-digital-and-decarbonization", "date": "2024-09"}, {"fact": "Aker BP co-development of an AI-driven platform on Delfi, migrating Aker BP's application portfolio to the cloud. It builds on SLB's OSDU commitment and integration with Microsoft Azure Data Manager for Energy.", "src": "https://www.businesswire.com/news/home/20240722159176/en", "date": "2024-07"}, {"fact": "Ocean is SLB's software development framework for building plug-ins into Petrel, Studio E&P and Techlog, 'based on state-of-the-art Microsoft technology'. More than 120 Ocean plug-ins exist for Petrel, and there is an Ocean Certified Partner program.", "src": "https://www.slb.com/products-and-services/delivering-digital-at-scale/software/ocean", "date": "n.d."}, {"fact": "The 10-K says Delfi and Lumi cloud platforms are central to Digital, that Digital Exploration uses high-performance cloud computing, and that Professional Services supports customers' on-prem-to-cloud migrations.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}], "leaders": [{"name": "Olivier Le Peuch", "title": "Chief Executive Officer", "src": "https://www.slb.com/about/leadership-and-governance/executive-management", "date": "2026-10 (page fetched)", "stale": false}, {"name": "Rakesh Jaggi", "title": "President, Digital (leads digital and AI solutions; role since Apr 2023; earlier president of Digital & Integration). Quoted as president of Digital in Jun 2026.", "src": "https://www.slb.com/newsroom/press-release/2026/slb-launches-digital-marketplace-to-scale-ai-and-digital-innovation-across-energy", "date": "2026-06", "stale": false}, {"name": "Demosthenis (Demos) Pafitis", "title": "Chief Technology Officer (since Feb 2020); oversees technology development strategy", "src": "https://www.slb.com/newsroom/press-release/2026/pr-2026-0325-slb-nvidia", "date": "2026-03", "stale": false}, {"name": "Tarek Rizk", "title": "Chief Performance Officer; remit includes digital enablement and information technology (the function created in the Feb 2025 reorg covering security, operational integrity, global business services)", "src": "https://www.slb.com/about/leadership-and-governance/executive-management", "date": "2026-10 (page fetched)", "stale": false}, {"name": "Stephane Biguet", "title": "EVP and Chief Financial Officer (presented 2030 digital financial ambitions)", "src": "https://www.slb.com/about/leadership-and-governance/executive-management", "date": "2026-10 (page fetched)", "stale": false}, {"name": "Aparna Raman", "title": "Chief Strategy Officer", "src": "https://www.slb.com/about/leadership-and-governance/executive-management", "date": "2026-10 (page fetched)", "stale": false}, {"name": "Unnamed (not found)", "title": "Chief Information Officer. Per the 10-K, the Cybersecurity Director reports to the CIO; neither is named publicly.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01", "stale": false}], "recent_events": [{"fact": "Q2 2026 results: completed the acquisition of Tachyus (ML plus physics reservoir modeling; Aqueon platform on more than 7,500 wells), to be integrated into Delfi and Lumi for closed-loop reservoir management.", "src": "https://www.slb.com/newsroom/updates/2026/2026-0528-slb-tachyus-update", "date": "2026-05"}, {"fact": "Definitive agreement to acquire S&P Global Energy's upstream geoscience and petroleum engineering software portfolio, used mainly by US onshore/unconventional operators. Closing is expected 2H26 or early 2027. The tech stack will be integrated gradually, and SLB will co-build AI models on Lumi and Tela with S&P data.", "src": "https://www.slb.com/newsroom/updates/2026/2026-0423-sp-global-acquisition", "date": "2026-04"}, {"fact": "Digital Investor Day set 2030 targets of doubling Digital revenue and EBITDA and positioned SLB as 'digital-first'.", "src": "https://www.stockopedia.com/share-prices/schlumberger-nv-EPA:SLB/news/slb-looks-to-double-digital-business-revenue-core-profit-by-2030-updated-019ed6cb-6de8-7bc2-ac46-d060e2413b3b/", "date": "2026-06"}, {"fact": "Digital marketplace launched for AI agents, models and apps from SLB and partners.", "src": "https://www.slb.com/newsroom/press-release/2026/slb-launches-digital-marketplace-to-scale-ai-and-digital-innovation-across-energy", "date": "2026-06"}, {"fact": "Q1 2026: Middle East disruption (Qatar force majeure and offshore suspensions, Iraq security) cut revenue about 10.5% sequentially. The CFO said there was no material adjustment to the cost base in the quarter.", "src": "https://news.alphastreet.com/schlumberger-limited-slb-q1-2026-earnings-call-transcript/", "date": "2026-04"}, {"fact": "Workforce reduction charges totaled about $407M pretax across 2025 ($158M Q1, $66M Q2, $57M Q3, $126M Q4).", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}, {"fact": "ChampionX acquisition closed in Q3 2025 (all-stock, 141M shares, ~$4.9B). Q2 2026 still carried $69M of merger and integration charges.", "src": "https://www.sec.gov/Archives/edgar/data/0000087347/000119312526315068/d122193dex99.htm", "date": "2026-07"}, {"fact": "Launched the Tela agentic AI assistant at ADIPEC, Abu Dhabi.", "src": "https://www.slb.com/news-and-insights/newsroom/press-release/2025/pr-2025-1103-slb-tela-ai", "date": "2025-11"}, {"fact": "Expanded the NVIDIA partnership (AI Factory for Energy, DSX modular AI factories).", "src": "https://www.slb.com/newsroom/press-release/2026/pr-2026-0325-slb-nvidia", "date": "2026-03"}], "agent_signals": [{"fact": "Ongoing integration of acquired software stacks: ChampionX, Tachyus (into Delfi/Lumi) and the pending S&P Global Energy upstream software portfolio, which SLB will integrate gradually 'keeping existing customer workflows intact'. This creates code migration, consolidation and re-platforming work.", "src": "https://www.slb.com/newsroom/updates/2026/2026-0423-sp-global-acquisition", "date": "2026-04"}, {"fact": "Large desktop/plug-in estate built on Microsoft technology: Petrel, Studio E&P and Techlog extended by Ocean, with more than 120 Petrel plug-ins. This suggests Windows/.NET codebases that must coexist with cloud-native Delfi/Lumi.", "src": "https://www.slb.com/products-and-services/delivering-digital-at-scale/software/ocean", "date": "n.d."}, {"fact": "Products must support multi-cloud (Microsoft, AWS, Google), on-prem and edge deployment, which multiplies build, test and release targets.", "src": "https://quartr.com/events/slb-n-v-slb-investor-day-2026_3YCy3gxu", "date": "2026-06"}, {"fact": "The marketplace requires security, interoperability and compatibility certification for every SLB and third-party listing (about 200 products, 30+ partners). This is a scaled code review and verification burden.", "src": "https://www.slb.com/newsroom/press-release/2026/slb-launches-digital-marketplace-to-scale-ai-and-digital-innovation-across-energy", "date": "2026-06"}, {"fact": "The 10-K discloses phishing and ransomware incidents (not material). The cyber program follows NIST CSF/ISO 27001, with a 3-site 24/7 SOC, and the Cybersecurity Director reports to the CIO.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}, {"fact": "Margin pressure on Digital: Q1 2026 Digital adjusted EBITDA margin fell to 26.1%, against a 2030 target of 38-42%. Engineering productivity directly affects that margin path.", "src": "https://news.alphastreet.com/schlumberger-limited-slb-q1-2026-earnings-call-transcript/", "date": "2026-04"}, {"fact": "SLB is itself building agentic AI (Tela, Lumi agentic framework, NVIDIA Nemotron-based AI Factory) and runs developer.slb.com. It is AI-literate, may build internally and may view coding agents through a partner/marketplace lens.", "src": "https://www.slb.com/newsroom/press-release/2026/pr-2026-0325-slb-nvidia", "date": "2026-03"}, {"fact": "Professional Services supports customers' on-prem-to-cloud migrations, a services line where migration labor could be automated.", "src": "https://www.sec.gov/Archives/edgar/data/87347/000119312526021017/slb-20251231.htm", "date": "2026-01"}], "hypotheses": {"pains": ["HYPOTHESIS: Integrating three acquired codebases (ChampionX digital, Tachyus Aqueon, S&P Global Kingdom/Petra/Harmony-type tools) into Delfi/Lumi without breaking customer workflows strains limited senior engineering capacity.", "HYPOTHESIS: Modernizing legacy Windows/.NET desktop apps (Petrel/Techlog/Ocean plug-in API) toward cloud-native Delfi/Lumi is slow and costly, and backward compatibility for 120+ third-party plug-ins makes refactors risky.", "HYPOTHESIS: Doubling Digital ARR to ~$2B while lifting EBITDA margin to 38-42% requires shipping more product without growing R&D headcount proportionally, after ~$407M of 2025 workforce reduction charges.", "HYPOTHESIS: Marketplace certification (security, interop, compatibility) for ~200 products and growing creates a review/testing bottleneck that coding agents could scale.", "HYPOTHESIS: Multi-cloud plus on-prem plus edge deployment targets multiply CI, test and maintenance toil (dependency upgrades, CVE remediation) across the portfolio.", "HYPOTHESIS: Internal IT (under the CIO, within the Chief Performance Officer's org) carries ERP/back-office legacy and post-merger system consolidation from ChampionX."], "economic_buyer": ["HYPOTHESIS: Rakesh Jaggi, President Digital, for product engineering velocity tied to the 2030 Digital targets.", "HYPOTHESIS: Demos Pafitis, CTO, for R&D/technology-center engineering productivity.", "HYPOTHESIS: Tarek Rizk, Chief Performance Officer, whose remit includes IT and digital enablement, for internal IT/back-office modernization and the cost agenda.", "HYPOTHESIS: The unnamed CIO reporting into the performance function, for enterprise IT applications."], "champions": ["HYPOTHESIS: VP/Head of Engineering or Platform for Delfi/Lumi (cloud platform engineering leads).", "HYPOTHESIS: Product/engineering leader for integration of S&P Global upstream software or Tachyus (M&A integration owner within Digital).", "HYPOTHESIS: Head of the developer ecosystem / Ocean and marketplace partner program (developer.slb.com).", "HYPOTHESIS: Cybersecurity Director (reports to CIO), for codebase-wide security scanning and remediation.", "HYPOTHESIS: Software technology center leads (e.g., Houston/Abingdon/Pune-type engineering hubs; locations not verified) running AI-for-engineering pilots."], "competition": ["HYPOTHESIS: GitHub Copilot / Copilot agent mode via a Microsoft EA, given the Microsoft-based Ocean stack and Azure relationship (EA/Copilot usage not publicly confirmed).", "HYPOTHESIS: Amazon Q Developer / Kiro via the AWS partnership; Google Gemini Code Assist via Google Cloud.", "HYPOTHESIS: Internal build on Lumi agentic framework / NVIDIA Nemotron models, given SLB's own agentic AI ambitions (Tela) and AI-native positioning.", "HYPOTHESIS: Cursor, Claude Code or other IDE agents adopted bottom-up by developers.", "HYPOTHESIS: SIs and offshore engineering partners (e.g., Indian IT services firms) for migration and integration work. Specific SI relationships were not found in public sources."], "openers": ["You've committed to doubling Digital to ~$2B with 38-42% EBITDA margins by 2030 while integrating Tachyus and the S&P Global software portfolio. How much of that integration and re-platforming work is sitting on the same engineering teams that need to ship new Lumi/Tela capabilities, and what gets deprioritized?", "Petrel, Techlog and the Ocean ecosystem carry a lot of Microsoft/.NET desktop code that has to keep working for 120+ partner plug-ins while you move to cloud-native Delfi/Lumi across three hyperscalers plus on-prem. Where does that modernization stand, and what's the hardest part to test safely?", "You now certify every marketplace listing for security and interoperability, and you build agents for customers with Tela. How are you using agents inside your own software engineering org today, and what would you need to see to trust an autonomous agent on a production codebase?"]}, "notes": "No public CIO, CISO or head-of-software-engineering name was found. The 10-K references a CIO and a Cybersecurity Director without naming them, and the leadership page places IT under Chief Performance Officer Tarek Rizk. Use LinkedIn or Sales Navigator to identify them. Rakesh Jaggi's title appears as 'President, Digital' (2026 releases, leadership page) and as 'President, Digital and Integration' (Tela release Nov 2025, AWS 2024); his bio page metadata is dated 2022. The Digital Investor Day date conflicts: the SLB release and Upstream say June 17, 2026, while the Quartr summary says June 23, 2026, so trust June 17. The 2030 Digital target is described as ~$2B 'revenue' (Reuters via Stockopedia) and as '$2B ARR' (Quartr). Note that FY2025 Digital segment revenue was already $2.66B while ARR is ~$1.04B, so the 'double to $2B' target most likely refers to ARR; verify. The Q1 2026 transcript is internally inconsistent on the full-year Digital EBITDA margin target (35% vs 45%). The Reuters reorg/job-cuts story (new chief performance officer function) is dated Feb 11, 2025, though one aggregator showed a 2026 date. It is older than 12 months. No public evidence was found of a Microsoft EA, GitHub Copilot use, internal AI coding initiatives, IT outsourcing/SI relationships, or software engineering headcount. Q3 2026 results land Oct 23, 2026; refresh after the call. The Ocean 'Microsoft technology' basis is from an undated product page; specific .NET/Windows requirements were not verified (the PDF was blocked by robots.txt)."}}, {"id": "enterpriseproducts", "account": "Enterprise Products", "research": "enterpriseproducts", "tier": 2, "stage": "Prospect: no relationship yet", "play": "Commercial systems backlog and pipeline security directives", "thesis": "Enterprise Products is at record volumes, has raised its 2026 growth capex to $2.9-3.4B, and keeps adding assets (Bahia, Neches River, Occidental/Permian). All of that runs through an in-house .NET/SQL Server commercial application estate kept up by a lean team, under the TSA pipeline security directives. Devin adds capacity to extend, test and secure that estate without building up function srcLink(a,r){const x=ref(a,r);if(!x)return'<span class="muted">-</span>';const u=x.src||x.url;const d=x.date?` · ${esc(x.date)}`:"";return u?`<a class="src" href="${esc(u)}" target="_blank" rel="noopener">source${d}</a>`:`<span class="src muted">${d}</span>`}
function searches(q){const e=encodeURIComponent(q);return `<span class="search"><a target="_blank" rel="noopener" href="https://www.linkedin.com/sales/search/people?keywords=${e}">Sales Nav</a><a target="_blank" rel="noopener" href="https://www.linkedin.com/search/results/people/?keywords=${e}">LinkedIn</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('site:linkedin.com/in '+q)}">X-ray</a></span>`}
const ul=xs=>`<ul>${(xs||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
const score=a=>(a.meddpicc||[]).reduce((s,x)=>s+(+x.score||0),0);
function date(wk){const d=new Date(T.start+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+7*wk);return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})}
let nav=`<h1>${esc(T.title)}</h1><div class="sub">MEDDPICC · Command of the Message · McMahon</div>
<details open><summary>Territory</summary><a href="#territory">Thesis & principles</a><a href="#tiers">Tiering</a><a href="#pg">Pipeline generation</a><a href="#cadence">Operating cadence</a><a href="#linkedin">LinkedIn method</a><a href="#scoreboard">Scoreboard</a></details>`;
A.forEach((a,n)=>{nav+=`<details ${n===0?"open":""}><summary><span>${esc(a.account)}</span><span class="sc">T${a.tier} · ${score(a)}/24</span></summary>${SECS.map(([k,l])=>`<a href="#${a.id}-${k}">${l}</a>`).join("")}</details>`});
$("#nav").innerHTML=nav;
let h=`<section id="territory"><div class="kick">Territory account plan</div><h2>${esc(T.title)}</h2><p class="thesis">${esc(T.thesis)}</p><h3>Operating principles</h3>${ul(T.principles)}</section>
<section id="tiers"><div class="kick">McMahon: tier, then time-block</div><h2>Tiering</h2><div class="grid">${T.tiers.map(x=>`<div class="card"><h4>${esc(x.label)}</h4>${esc(x.rule)}<div style="margin-top:8px">${A.filter(a=>a.tier===x.tier).map(a=>`<a class="chip ok" href="#${a.id}-summary">${esc(a.account)}</a>`).join("")||'<span class="muted">-</span>'}</div></div>`).join("")}</div></section>
<section id="pg"><div class="kick">Pipeline generation</div><h2>PG plan</h2><table><tr><th>Lever</th><th>How</th><th>Target</th></tr>${T.pg.map(x=>`<tr><td><b>${esc(x.lever)}</b></td><td>${esc(x.how)}</td><td>${esc(x.target)}</td></tr>`).join("")}</table></section>
<section id="cadence"><div class="kick">Execution</div><h2>Operating cadence</h2><table>${T.cadence.map(x=>`<tr><td style="width:120px"><b>${esc(x.when)}</b></td><td>${esc(x.what)}</td></tr>`).join("")}</table></section>
<section id="linkedin"><div class="kick">Stakeholder research</div><h2>LinkedIn method</h2>${ul(T.linkedin)}<p class="muted">${esc(T.add_account)}</p></section>
<section id="scoreboard"><div class="kick">Inspection</div><h2>Territory scoreboard</h2><table><tr><th>Account</th><th>Tier</th><th>Stage</th>${Object.keys(LN).map(k=>`<th title="${LN[k]}">${LL[k]}</th>`).join("")}<th>Total</th><th>Play</th></tr>${A.map(a=>{const m={};(a.meddpicc||[]).forEach(x=>m[x.l]=x.score);return`<tr><td><a href="#${a.id}-summary"><b>${esc(a.account)}</b></a></td><td>T${a.tier}</td><td>${esc(a.stage)}</td>${Object.keys(LN).map(k=>`<td>${m[k]??"-"}</td>`).join("")}<td><b>${score(a)}</b>/24</td><td>${esc(a.play||"")}</td></tr>`}).join("")}</table><div class="legend">Score per letter: 0 unknown · 1 hypothesis from public sources · 2 confirmed by the customer · 3 confirmed and documented in the MAP.</div></section>`;
A.forEach(a=>{const c=a.com||{},e=a.engagement||{};
h+=`<section id="${a.id}-summary" class="acct-head"><div class="kick">Tier ${a.tier} · ${esc(a.stage)}</div><h2>${esc(a.account)}</h2>${a.play?`<p><b>Play:</b> ${esc(a.play)}</p>`:""}<p class="thesis">${esc(a.thesis)}</p><h3>Why now</h3><table>${(a.why_now||[]).map(x=>`<tr><td>${esc(x.t)}</td><td style="width:130px">${srcLink(a,x.ref)}</td></tr>`).join("")}</table></section>
<section id="${a.id}-challenges"><div class="kick">Identify pain · in their words</div><h2>Publicly stated challenges</h2><table><tr><th>What they said</th><th>Who</th><th>Where Devin fits</th><th>Source</th></tr>${(a.challenges||[]).map(x=>`<tr><td>${esc(x.stated)}</td><td>${esc(x.who)}</td><td>${esc(x.devin)}</td><td>${srcLink(a,x.ref)}</td></tr>`).join("")}</table></section>
<section id="${a.id}-pain"><div class="kick">Pain by altitude</div><h2>Pain chain</h2><table><tr><th>Level</th><th>Pain</th><th>How they measure it</th></tr>${(a.pain_chain||[]).map(x=>`<tr><td><b>${esc(x.level)}</b></td><td>${esc(x.pain)}</td><td>${esc(x.measure)}</td></tr>`).join("")}</table></section>
<section id="${a.id}-com"><div class="kick">Command of the Message</div><h2>Value framework</h2><p class="elev">${esc(c.elevator)}</p><div class="grid">${[["Before scenario",c.before],["Negative consequences",c.negative],["After scenario",c.after],["Required capabilities",c.required],["Metrics",c.metrics],["How we do it",c.how],["Proof",c.proof]].map(([t,x])=>`<div class="card"><h4>${t}</h4>${ul(x)}</div>`).join("")}</div></section>
<section id="${a.id}-meddpicc"><div class="kick">Qualification · ${score(a)}/24</div><h2>MEDDPICC scorecard</h2><table><tr><th></th><th>Letter</th><th>Score</th><th>What we know</th><th>Gap</th><th>Next action</th></tr>${(a.meddpicc||[]).map(x=>`<tr><td class="L">${LL[x.l]}</td><td><b>${LN[x.l]}</b></td><td><span class="bar s${x.score}"><i style="width:${x.score/3*100}%"></i></span> ${x.score}/3</td><td>${esc(x.known)}</td><td>${esc(x.gap)}</td><td>${esc(x.next)}</td></tr>`).join("")}</table></section>
<section id="${a.id}-stakeholders"><div class="kick">Power map</div><h2>Stakeholders</h2><table><tr><th>Name / title</th><th>Role</th><th>Cares about</th><th>Approach</th><th>Source & search</th></tr>${(a.stakeholders||[]).map(x=>{const q=x.q||(x.name&&x.name!=="TBD"?`"${x.name}" ${a.account}`:`${a.account} ${x.title}`);return`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.title)}</span></td><td><span class="chip">${esc(x.role)}</span>${x.verify?'<span class="chip v">verify</span>':x.src_url?'<span class="chip ok">Sales Nav</span>':'<span class="chip ok">public source</span>'}</td><td>${esc(x.cares)}</td><td>${esc(x.approach)}</td><td>${x.src_url?`<a class="src" href="${esc(x.src_url)}">Sales Nav pull · Oct 21</a>`:srcLink(a,x.src)}<br>${searches(q)}</td></tr>`}).join("")}</table>${(a.searches||[]).length?`<h3>Role searches: find champions and technical buyers</h3><table>${a.searches.map(s=>`<tr><td><b>${esc(s.label)}</b><br><span class="muted src">${esc(s.q)}</span></td><td>${searches(s.q)}</td></tr>`).join("")}</table>`:""}</section>
<section id="${a.id}-engagement"><div class="kick">Engagement strategy</div><h2>Engagement & pipeline generation</h2><p><b>Entry:</b> ${esc(e.entry)}</p><div class="grid">${(e.phases||[]).map(p=>`<div class="card"><h4>${esc(p.when)}</h4>${ul(p.what)}</div>`).join("")}</div><h3>PG sequence</h3><table><tr><th>Target</th><th>Channel</th><th>Message</th></tr>${(e.pg||[]).map(x=>`<tr><td><b>${esc(x.to)}</b></td><td>${esc(x.channel)}</td><td>${esc(x.message)}</td></tr>`).join("")}</table><div class="grid" style="margin-top:12px"><div class="card"><h4>Events</h4>${ul(e.events)}</div><div class="card"><h4>Partners</h4>${ul(e.partners)}</div></div></section>
<section id="${a.id}-map"><div class="kick">Mutual action plan · draft dates from ${esc(date(0))}</div><h2>Mutual action plan</h2><table><tr><th>Target date</th><th>Step</th><th>Owner</th><th>Letter</th><th>Exit criteria</th></tr>${(a.map||[]).map(x=>`<tr><td class="src">${date(x.wk)}</td><td>${esc(x.step)}</td><td>${esc(x.owner)}</td><td class="L">${LL[x.letter]||""}</td><td>${esc(x.exit)}</td></tr>`).join("")}</table><div class="legend">These dates are a draft. They only count toward the forecast once the champion agrees them.</div></section>
<section id="${a.id}-risks"><div class="kick">Inspect</div><h2>Risks & next steps</h2><table><tr><th>Risk</th><th>Mitigation</th></tr>${(a.risks||[]).map(x=>`<tr><td>${esc(x.r)}</td><td>${esc(x.m)}</td></tr>`).join("")}</table><h3>Next actions</h3>${ul(a.next)}</section>`});
$("#main").innerHTML=h;
function jump(){const id=location.hash.slice(1);if(!id)return;let el=document.getElementById(id)||document.getElementById(A[0].id+"-"+id);if(el)el.scrollIntoView()}
addEventListener("hashchange",jump);jump();
const links=[...document.querySelectorAll("nav a")];const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){links.forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#"+en.target.id))}}),{rootMargin:"-10% 0px -80% 0px"});document.querySelectorAll("section").forEach(s=>io.observe(s));
</script></body></html>
